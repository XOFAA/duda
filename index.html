<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite 🍻</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #7c2d12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      opacity: .85;
      margin-bottom: 28px;
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 18px;
      animation: pulse 1.5s infinite;
    }

    .buttons {
      width: 100%;
      height: 210px;
      position: relative;
      margin-top: 10px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: .15s;
      white-space: nowrap;
    }

    button:active {
      transform: scale(.95);
    }

    #yesBtn {
      background: #22c55e;
      color: white;
      box-shadow: 0 10px 25px rgba(34,197,94,.35);
      position: absolute;
      left: 55px;
      top: 0;
    }

    #noBtn {
      background: #ef4444;
      color: white;
      box-shadow: 0 10px 25px rgba(239,68,68,.35);
      position: absolute;
      right: 55px;
      top: 0;
    }

    .footer {
      margin-top: 16px;
      font-size: .82rem;
      opacity: .65;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 1.6rem;
      }

      .buttons {
        height: 240px;
      }

      button {
        padding: 13px 22px;
        font-size: .95rem;
      }

      #yesBtn {
        left: 35px;
      }

      #noBtn {
        right: 35px;
      }
    }

    @media (max-width: 340px) {
      #yesBtn {
        left: 15px;
      }

      #noBtn {
        right: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🍻</div>

    <h1>Bora tomar uma hoje?</h1>

    <p>Convite oficial e sem possibilidade de recusa.</p>

    <div class="buttons" id="buttonsArea">
      <button id="yesBtn">Sim 😎</button>
      <button id="noBtn">Não 😔</button>
    </div>

    <div class="footer">escolha com sabedoria...</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonsArea = document.getElementById("buttonsArea");

    const phone = "5592993795370";
    const message = encodeURIComponent("Bora tomar uma hoje? 🍻 Eu aceito 😎");

    yesBtn.addEventListener("click", () => {
      window.location.href = `https://wa.me/${phone}?text=${message}`;
    });

    function moveNoButton() {
      const padding = 8;

      const areaWidth = buttonsArea.clientWidth;
      const areaHeight = buttonsArea.clientHeight;

      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const maxX = areaWidth - btnWidth - padding;
      const maxY = areaHeight - btnHeight - padding;

      const randomX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
      const randomY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

      noBtn.style.left = `${randomX}px`;
      noBtn.style.right = "auto";
      noBtn.style.top = `${randomY}px`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
    });
  </script>

</body>
</html>
